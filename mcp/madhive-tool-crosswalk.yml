note: >-
  Madhive publishes 22 MCP tools and a 75-operation REST API over the same campaign core.
  The live MCP tools/list is OAuth-gated (HTTP 401 anonymous), so each tool's real
  inputSchema could not be introspected; the bindings below are derived by matching the
  provider's published tool names and descriptions to REST operationIds verified verbatim
  in openapi/madhive-api-openapi-original.yml. Confidence is set honestly: high where the
  tool maps 1:1 or to an obvious CRUD triple, medium where a single tool fans out across
  several operations or composes them server-side.
