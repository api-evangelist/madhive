aid: madhive
name: MadHive
description: 'Madhive is a New York-based advertising technology company that operates
  a demand-side platform (DSP) and end-to-end software stack built for local and connected
  TV (CTV/OTT) advertising. Broadcasters, local media sellers, agencies and political
  advertisers use Madhive to plan campaigns, activate premium streaming and broadcast
  inventory, build cookieless audiences from first-party and offline data, manage creatives,
  and measure outcomes from a single unified DSP. Madhive publishes a public developer
  program at developer.madhive.com — an Apigee-fronted REST API covering campaigns,
  line items, advertisers, agencies, creatives, audiences, segments, retargeting, publishers,
  publisher groups, tracking pixels, products, metros and optimization templates —
  alongside a hosted Model Context Protocol (MCP) server that exposes the same campaign-management
  surface to AI assistants such as Claude and Gemini over JSON-RPC 2.0 with OAuth 2.0.'
image: https://cdn.prod.website-files.com/66f4642913b966635efd9666/675750501cfd31ca8779c1a9_og%20image.jpg
url: https://raw.githubusercontent.com/api-evangelist/madhive/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-04'
modified: '2026-08-04'
tags:
- Company
- Advertising
- AdTech
- Connected TV
- CTV
