    url: openapi/madhive-mcp-openapi-original.json
  - type: MCPServer
    url: mcp/madhive-mcp.yml
  - type: ToolCrosswalk
    url: mcp/madhive-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.madhive.com/mcp
