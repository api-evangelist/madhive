apis:
- aid: madhive:madhive-api
  name: Madhive API
  description: 'The Madhive Public API is a REST interface for digital advertising
    clients and services, fronted by Apigee and authenticated with OAuth 2.0 client
    credentials. It covers the full campaign lifecycle — create and manage campaigns
    and line items, set impression and budget goals, schedule flights, activate and
    pause delivery — plus advertisers, agencies, creatives (VAST tags and CDN assets)
    with Media Trust malware scanning, custom and standard audiences with boolean segment
    logic, retargeting segments, tracking pixels, publishers and publisher groups,
    contextual segments, stations, metros, products and optimization templates (Supply
    Guardrails).'
  humanURL: https://developer.madhive.com/
  baseURL: https://api2.madhive.com/api
  tags:
  - Advertising
  - Campaigns
  - Audiences
  - Creatives
  - Connected TV
  properties:
  - type: OpenAPI
    url: openapi/madhive-api-openapi-original.yml
  - type: Documentation
    url: https://developer.madhive.com/
- aid: madhive:madhive-mcp
  name: Madhive MCP API
  description: 'The Madhive MCP API is a hosted Model Context Protocol server that
    exposes Madhive campaign management to AI assistants over JSON-RPC 2.0, authenticated
    with OAuth 2.0 via Apigee. It supports both machine-to-machine (client credentials)
    and user-delegated (authorization code with PKCE) flows, and publishes 22 tools
    covering campaigns, advertisers, agencies, creatives, audiences, publishers, publisher
    groups, segments, retargeting, line items, pixels, orgs, metros and products. Documented
    clients include Claude Code, Claude Desktop/Web, Gemini CLI, Gemini Enterprise
    and custom agents.'
  humanURL: https://developer.madhive.com/mcp
  baseURL: https://api2.madhive.com/mcp
  tags:
  - Model Context Protocol
  - AI Agents
  - Campaign Management
  properties:
